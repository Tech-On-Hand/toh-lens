[package]
name = "native-capture-spike"
version = "0.0.0"
description = "Throwaway spike: capture a window with Windows Graphics Capture from Rust, no browser involved"
edition = "2021"

[dependencies]
windows-capture = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
