[package]
name = "native-capture-spike"
version = "0.0.0"
description = "Throwaway spike: capture a window with Windows Graphics Capture from Rust, no browser involved"
edition = "2021"

[dependencies]
windows-capture = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
webrtc = "0.13"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "webrtc-send"
path = "src/bin/webrtc_send.rs"

[[bin]]
name = "broadcast-send"
path = "src/bin/broadcast_send.rs"
