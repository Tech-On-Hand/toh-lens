<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page blocked</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; color: #24352b; background: #f4f7f2; }
    main { max-width: 480px; padding: 40px 32px; text-align: center; }
    .mark { width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 16px; background: #2d5a3d; color: #fff; font-size: 28px; line-height: 56px; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 8px 0; color: #55665b; line-height: 1.5; }
    .site { font-weight: 600; color: #24352b; word-break: break-all; }
    button { margin-top: 22px; padding: 10px 20px; border: 0; border-radius: 9px; background: #2d5a3d; color: #fff; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="mark">K</div>
    <h1>This page isn't available right now</h1>
    <p id="why"></p>
    <p class="site" id="site"></p>
    <button id="back">Go back</button>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
