<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page blocked</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      /* TOH Brand Colors */
      --toh-navy: oklch(23.328% 0.11401 267.511); /* #081352 */
      --toh-blue: oklch(0.544 0.154 232.5); /* #007CB9 - darkened from #00B7FF for 4.5:1 text contrast */
      --toh-blue-light: oklch(0.559 0.108 237.8); /* #267CAC - darkened from #5D9BE8 for 4.5:1 text contrast */
      --toh-green: oklch(0.550 0.165 127.8); /* #558200 - darkened from #8BCC45 for 4.5:1 text contrast */
      --toh-purple: oklch(0.588 0.215 305.5); /* #9C4DE0 - darkened from #BF62F5 for 4.5:1 text contrast */
      --toh-cream: oklch(0.97 0.012 75.5); /* #F8F4EE */
      --toh-yellow: oklch(0.942 0.132 102.5); /* #F5F37F */
      --toh-orange: oklch(0.579 0.168 45.8); /* #C65000 - darkened from #ff9500 for 4.5:1 text contrast */
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: #24352b;
      background-image:
        url('blobs/toh-blob-blue.svg'),
        url('blobs/toh-blob-purple.svg'),
        url('blobs/toh-blob-green.svg'),
        url('blobs/toh-blob-orange.svg');
      background-repeat: no-repeat;
      background-position: -6% -8%, 106% -6%, -8% 104%, 104% 102%;
      background-size: 260px, 220px, 240px, 200px;
      background-color: #ffffff;
    }
    main { max-width: 480px; padding: 40px 32px; text-align: center; }
    .mark { display: block; width: 56px; height: 56px; margin: 0 auto 20px; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 8px 0; color: #55665b; line-height: 1.5; }
    .site { font-weight: 600; color: #24352b; word-break: break-all; }
    button { margin-top: 22px; padding: 10px 20px; border: 0; border-radius: 9px; background: var(--toh-navy); color: #fff; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="icons/toh-mark.svg" alt="">

    <h1>This page isn't available right now</h1>
    <p id="why"></p>
    <p class="site" id="site"></p>
    <button id="back">Go back</button>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
